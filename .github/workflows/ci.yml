name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Unit tests, typecheck and build. Node versions on Linux, then the other OSes on the
  # default Node: sharp and ffmpeg-static ship native binaries that differ per platform.
  unit:
    name: unit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 22 }
          - { os: windows-latest, node: 22 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Packs the tarballs exactly as `npm publish` would and lints what users will receive.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -r pack --pack-destination "$RUNNER_TEMP/tarballs"
      - name: publint
        working-directory: ${{ runner.temp }}/tarballs
        run: for t in *.tgz; do npx -y publint@0.3.25 --strict "$t"; done
      - name: are the types wrong
        working-directory: ${{ runner.temp }}/tarballs
        run: |
          npx -y @arethetypeswrong/cli@0.18.5 scrollframe-core-0.0.0.tgz
          npx -y @arethetypeswrong/cli@0.18.5 scrollframe-react-0.0.0.tgz
          npx -y @arethetypeswrong/cli@0.18.5 --profile esm-only scrollframe-0.0.0.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          retention-days: 7

  # Installs the tarballs with plain npm in a fresh project on every OS and runs the
  # real CLI on a synthetic video (native binaries, bin shim, output on disk).
  cli-e2e:
    name: cli e2e (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
      - run: node e2e/scripts/prepare.mjs --tarballs "${{ runner.temp }}/tarballs" --work "${{ runner.temp }}/e2e"
      - run: npm run test:cli
        working-directory: ${{ runner.temp }}/e2e

  # A React app built from the tarballs, driven in Chromium, Firefox and WebKit.
  # The `demo` project records the scroll: download the `scroll-demo-video` artifact to watch it.
  browser-e2e:
    name: browser e2e
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
      - run: node e2e/scripts/prepare.mjs --tarballs "$RUNNER_TEMP/tarballs" --work "$RUNNER_TEMP/e2e"
      - name: generate the sequence and build the app
        working-directory: ${{ runner.temp }}/e2e
        run: |
          npm run sequence
          npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: ${{ runner.temp }}/e2e
      - run: npm run test:browser
        working-directory: ${{ runner.temp }}/e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scroll-demo-video
          path: ${{ runner.temp }}/e2e/test-results/*demo*/video.webm
          retention-days: 30
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            ${{ runner.temp }}/e2e/playwright-report
            ${{ runner.temp }}/e2e/test-results
          retention-days: 14

  # The single required check for `main`: green only when every job above passed.
  ci-passed:
    name: CI passed
    if: always()
    needs: [unit, package, cli-e2e, browser-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then exit 1; fi
          done
